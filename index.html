<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Grid of Iframes with Auto Reload</title>
  <style>
    /* Remove default margins */
    body {
      margin: 0;
      padding: 0;
    }

    /* Grid container styling */
    .grid-container {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(400px, 1fr));
      gap: 10px;
      padding: 10px;
    }

    /* Iframe styling, including transition for fading effects */
    .grid-container iframe {
      width: 100%;
      height: 400px;
      border: 1px solid #ccc;
      transition: opacity 0.5s ease;
      opacity: 1;
    }
  </style>
</head>
<body>
  <!-- Grid container for iframes -->
  <div class="grid-container">
    <iframe src=https://signal.pinmicro.com/home/312/1/103 width="400" height="300" frameborder="0" allowfullscreen></iframe>
    <iframe src=https://signal.pinmicro.com/home/312/1/101 width="400" height="300" frameborder="0" allowfullscreen></iframe>
    <iframe src=https://signal.pinmicro.com/home/312/1/102 width="400" height="300" frameborder="0" allowfullscreen></iframe>
    <iframe src=https://signal.pinmicro.com/home/312/1/104 width="400" height="300" frameborder="0" allowfullscreen></iframe>
    <iframe src=https://signal.pinmicro.com/home/312/1/105 width="400" height="300" frameborder="0" allowfullscreen></iframe>
    <iframe src=https://signal.pinmicro.com/home/312/1/106 width="400" height="300" frameborder="0" allowfullscreen></iframe>
    <iframe src=https://signal.pinmicro.com/home/312/1/107 width="400" height="300" frameborder="0" allowfullscreen></iframe>
    <iframe src=https://signal.pinmicro.com/home/312/1/108 width="400" height="300" frameborder="0" allowfullscreen></iframe>
    <iframe src=https://signal.pinmicro.com/home/312/1/109 width="400" height="300" frameborder="0" allowfullscreen></iframe>
    <iframe src=https://signal.pinmicro.com/home/312/1/110 width="400" height="300" frameborder="0" allowfullscreen></iframe>
    <!-- Add more iframes as needed -->
  </div>

  <script>
    // Function to add a load event to each iframe to fade it in once reloaded
    function initializeIframeFade() {
      document.querySelectorAll('.grid-container iframe').forEach(function(iframe) {
        // Ensure opacity is restored to 1 when content finishes loading
        iframe.addEventListener('load', function() {
          iframe.style.opacity = 1;
        });
      });
    }

    // Function to trigger reload with a fade-out effect
    function reloadIframes() {
      document.querySelectorAll('.grid-container iframe').forEach(function(iframe) {
        // Start fade-out
        iframe.style.opacity = 0;
        // Allow the fade-out to complete (500ms) before reloading
        setTimeout(function() {
          // Extract the original URL (without any query string)
          var originalSrc = iframe.src.split("?")[0];
          // Append a cache-busting query parameter to ensure a fresh load
          iframe.src = originalSrc + "?reload=" + new Date().getTime();
        }, 500);
      });
    }

    // Initialize event listeners for the fade effect
    initializeIframeFade();

    // Set an interval to reload the iframes every 10 seconds
    setInterval(reloadIframes, 10000);
  </script>
</body>
</html>
